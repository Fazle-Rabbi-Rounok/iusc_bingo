<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reflection Laser Draft</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 950px;
      margin: auto;
      background: #1f2937;
      padding: 20px;
      border-radius: 14px;
    }

    h1 {
      color: #38bdf8;
    }

    .instructions {
      color: #d1d5db;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    canvas {
      background: #020617;
      border: 2px solid #475569;
      border-radius: 12px;
      max-width: 100%;
      height: auto;
      touch-action: manipulation;
    }

    .controls {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin-top: 16px;
      min-height: 28px;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .small-note {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .shake {
      animation: shakeBoard 0.35s;
    }

    @keyframes shakeBoard {
      0% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
      100% { transform: translateX(0); }
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Reflection Laser Puzzle</h1>

    <p class="instructions">
      Rotate the mirrors so the hidden laser reaches the yellow target.<br>
      Tap a mirror to rotate it. The laser path appears only briefly after checking.
    </p>

    <canvas id="laserCanvas" width="760" height="560"></canvas>

    <div class="controls">
      <button onclick="resetPuzzle()">Reset</button>
      <button onclick="checkSolved()">Check Path</button>
    </div>

    <p class="small-note">
      Some mirrors are distractions. Not every mirror is needed.
    </p>

    <div class="message" id="message"></div>
  </div>

  <script>
    const canvas = document.getElementById("laserCanvas");
    const ctx = canvas.getContext("2d");
    const message = document.getElementById("message");

    const gridSize = 40;
    const cols = 19;
    const rows = 14;

    let showLaser = false;
    let solvedAlready = false;

    const source = {
      x: 1,
      y: 11,
      dir: "right"
    };

    const target = {
      x: 17,
      y: 2
    };

    const blockers = [
      { x: 5, y: 11 },
      { x: 6, y: 11 },
      { x: 7, y: 11 },

      { x: 3, y: 3 },
      { x: 4, y: 3 },
      { x: 5, y: 3 },

      { x: 9, y: 8 },
      { x: 9, y: 9 },
      { x: 9, y: 10 },

      { x: 12, y: 4 },
      { x: 12, y: 5 },
      { x: 12, y: 6 },

      { x: 15, y: 5 },
      { x: 15, y: 6 },
      { x: 15, y: 7 },

      { x: 14, y: 12 },
      { x: 15, y: 12 },

      { x: 16, y: 9 },
      { x: 17, y: 9 }
    ];

    let mirrors = [
      /* correct route, scrambled */
      { x: 4, y: 11, type: "\\" },  // correct: /
      { x: 4, y: 8, type: "\\" },   // correct: /
      { x: 8, y: 8, type: "/" },    // correct: \
      { x: 8, y: 12, type: "/" },   // correct: \
      { x: 10, y: 12, type: "\\" }, // correct: /
      { x: 10, y: 7, type: "\\" },  // correct: /
      { x: 14, y: 7, type: "/" },   // correct: \
      { x: 14, y: 10, type: "/" },  // correct: \
      { x: 18, y: 10, type: "\\" }, // correct: /
      { x: 18, y: 3, type: "/" },   // correct: \
      { x: 16, y: 3, type: "/" },   // correct: \
      { x: 16, y: 2, type: "\\" },  // correct: /

      /* decoy route A */
      { x: 4, y: 12, type: "/" },
      { x: 2, y: 9, type: "/" },
      { x: 6, y: 9, type: "\\" },

      /* decoy route B */
      { x: 4, y: 5, type: "\\" },
      { x: 7, y: 5, type: "/" },
      { x: 7, y: 2, type: "\\" },

      /* decoy route C */
      { x: 10, y: 5, type: "/" },
      { x: 13, y: 5, type: "\\" },
      { x: 13, y: 8, type: "/" },
      { x: 16, y: 8, type: "\\" },

      /* near-target decoys */
      { x: 15, y: 3, type: "/" },
      { x: 17, y: 4, type: "\\" },
      { x: 16, y: 5, type: "/" },

      /* added mirrors from green marks */
      { x: 1, y: 4, type: "/" },
      { x: 1, y: 8, type: "/" },
      { x: 7, y: 7, type: "/" },
      { x: 12, y: 10, type: "/" },

      /* remaining distractions */
      { x: 2, y: 2, type: "/" },
      { x: 3, y: 12, type: "\\" },
      { x: 13, y: 12, type: "\\" }
    ];

    const initialMirrors = JSON.parse(JSON.stringify(mirrors));

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          ctx.strokeStyle = "#1e293b";
          ctx.strokeRect(x * gridSize, y * gridSize, gridSize, gridSize);
        }
      }
    }

    function drawSource() {
      const cx = source.x * gridSize + gridSize / 2;
      const cy = source.y * gridSize + gridSize / 2;

      ctx.fillStyle = "#ef4444";
      ctx.beginPath();
      ctx.arc(cx, cy, 13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.font = "bold 11px Arial";
      ctx.fillText("LASER", cx - 20, cy - 18);
    }

    function drawTarget() {
      const cx = target.x * gridSize + gridSize / 2;
      const cy = target.y * gridSize + gridSize / 2;

      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.arc(cx, cy, 15, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#020617";
      ctx.font = "bold 12px Arial";
      ctx.fillText("T", cx - 4, cy + 4);
    }

    function drawBlockers() {
      blockers.forEach(b => {
        ctx.fillStyle = "#475569";
        ctx.fillRect(
          b.x * gridSize + 4,
          b.y * gridSize + 4,
          gridSize - 8,
          gridSize - 8
        );
      });
    }

    function drawMirrors() {
      mirrors.forEach((m, index) => {
        const x = m.x * gridSize;
        const y = m.y * gridSize;

        ctx.fillStyle = "#0f172a";
        ctx.fillRect(x + 4, y + 4, gridSize - 8, gridSize - 8);

        ctx.strokeStyle = "#38bdf8";
        ctx.lineWidth = 5;
        ctx.beginPath();

        if (m.type === "/") {
          ctx.moveTo(x + 8, y + gridSize - 8);
          ctx.lineTo(x + gridSize - 8, y + 8);
        } else {
          ctx.moveTo(x + 8, y + 8);
          ctx.lineTo(x + gridSize - 8, y + gridSize - 8);
        }

        ctx.stroke();
        ctx.lineWidth = 1;

        ctx.fillStyle = "#cbd5e1";
        ctx.font = "bold 11px Arial";
        ctx.fillText(index + 1, x + 5, y + 14);
      });
    }

    function nextPosition(x, y, dir) {
      if (dir === "right") return { x: x + 1, y };
      if (dir === "left") return { x: x - 1, y };
      if (dir === "up") return { x, y: y - 1 };
      if (dir === "down") return { x, y: y + 1 };
    }

    function reflect(dir, mirrorType) {
      if (mirrorType === "/") {
        if (dir === "right") return "up";
        if (dir === "left") return "down";
        if (dir === "up") return "right";
        if (dir === "down") return "left";
      }

      if (mirrorType === "\\") {
        if (dir === "right") return "down";
        if (dir === "left") return "up";
        if (dir === "up") return "left";
        if (dir === "down") return "right";
      }
    }

    function getMirrorAt(x, y) {
      return mirrors.find(m => m.x === x && m.y === y);
    }

    function isBlockerAt(x, y) {
      return blockers.some(b => b.x === x && b.y === y);
    }

    function traceLaser() {
      let x = source.x;
      let y = source.y;
      let dir = source.dir;

      const path = [];
      let solved = false;

      for (let step = 0; step < 300; step++) {
        const next = nextPosition(x, y, dir);

        x = next.x;
        y = next.y;

        if (x < 0 || x >= cols || y < 0 || y >= rows) break;

        path.push({ x, y });

        if (x === target.x && y === target.y) {
          solved = true;
          break;
        }

        if (isBlockerAt(x, y)) break;

        const mirror = getMirrorAt(x, y);

        if (mirror) {
          dir = reflect(dir, mirror.type);
        }
      }

      return { path, solved };
    }

    function drawLaserPath() {
      const result = traceLaser();

      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 4;
      ctx.beginPath();

      ctx.moveTo(
        source.x * gridSize + gridSize / 2,
        source.y * gridSize + gridSize / 2
      );

      result.path.forEach(p => {
        ctx.lineTo(
          p.x * gridSize + gridSize / 2,
          p.y * gridSize + gridSize / 2
        );
      });

      ctx.stroke();
      ctx.lineWidth = 1;

      return result.solved;
    }

    function draw() {
      drawGrid();
      drawBlockers();
      drawTarget();
      drawMirrors();
      drawSource();

      if (showLaser) {
        drawLaserPath();
      }
    }

    function rotateMirrorAt(canvasX, canvasY) {
      if (solvedAlready) return;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const x = Math.floor((canvasX - rect.left) * scaleX / gridSize);
      const y = Math.floor((canvasY - rect.top) * scaleY / gridSize);

      const mirror = getMirrorAt(x, y);

      if (mirror) {
        mirror.type = mirror.type === "/" ? "\\" : "/";
        message.textContent = "";
        showLaser = false;
        draw();
      }
    }

    canvas.addEventListener("click", function(event) {
      rotateMirrorAt(event.clientX, event.clientY);
    });

    canvas.addEventListener("touchstart", function(event) {
      event.preventDefault();
      const touch = event.touches[0];
      rotateMirrorAt(touch.clientX, touch.clientY);
    }, { passive: false });

    function resetPuzzle() {
      mirrors = JSON.parse(JSON.stringify(initialMirrors));
      showLaser = false;
      solvedAlready = false;
      message.textContent = "";
      draw();
    }

    function vibrateWrong() {
      canvas.classList.remove("shake");
      void canvas.offsetWidth;
      canvas.classList.add("shake");

      if (navigator.vibrate) {
        navigator.vibrate([120, 80, 120]);
      }
    }

    function checkSolved() {
      if (solvedAlready) return;

      const result = traceLaser();

      showLaser = true;
      draw();

      setTimeout(() => {
        showLaser = false;
        draw();

        if (result.solved) {
          solvedAlready = true;
          message.style.color = "#22c55e";
          message.innerHTML =
            "Correct. Laser reached the target. Secret digit unlocked: <strong>6</strong>";
        } else {
          message.textContent = "";
          vibrateWrong();
        }
      }, 2000);
    }

    draw();
  </script>
</body>
</html>
