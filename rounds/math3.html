<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sugar Jar Puzzle</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    padding: 20px;
    text-align: center;
  }

  .game {
    max-width: 900px;
    margin: auto;
    background: #1f2937;
    border-radius: 18px;
    padding: 22px;
  }

  h1 {
    color: #38bdf8;
  }

  .instructions {
    color: #d1d5db;
    line-height: 1.7;
  }

  .jar-area {
    display: flex;
    justify-content: center;
    align-items: end;
    gap: 24px;
    margin-top: 30px;
    flex-wrap: wrap;
  }

  .jar-card {
    background: #020617;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 16px;
    width: 180px;
  }

  .jar {
    position: relative;
    height: 260px;
    width: 90px;
    margin: auto;
    border: 4px solid #94a3b8;
    border-top: none;
    border-radius: 0 0 18px 18px;
    overflow: hidden;
    background: #111827;
  }

  .sugar {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: #facc15;
    transition: height 0.3s ease;
  }

  .marks {
    position: absolute;
    inset: 0;
    z-index: 2;
  }

  .mark {
    position: absolute;
    left: 0;
    width: 100%;
    border-top: 1px solid rgba(255,255,255,0.35);
    font-size: 0.65rem;
    color: white;
    text-align: right;
    padding-right: 4px;
  }

  .jar-info {
    margin-top: 12px;
    font-weight: bold;
    color: #f8fafc;
  }

  .jar-amount {
    color: #facc15;
    margin-top: 5px;
  }

  .selected {
    outline: 4px solid #38bdf8;
  }

  button {
    padding: 12px 16px;
    margin: 6px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.95rem;
  }

  .select-btn {
    background: #38bdf8;
    color: #020617;
  }

  .reset-btn {
    background: #64748b;
    color: white;
  }

  .message {
    margin-top: 22px;
    min-height: 28px;
    font-weight: bold;
  }

  .success {
    color: #22c55e;
  }

  .danger {
    color: #f87171;
  }

  .neutral {
    color: #d1d5db;
  }

  .move-log {
    margin-top: 22px;
    background: #020617;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 14px;
    max-height: 180px;
    overflow-y: auto;
    text-align: left;
    color: #cbd5e1;
    font-size: 0.9rem;
  }

  @media (max-width: 650px) {
    .jar-card {
      width: 150px;
    }

    .jar {
      height: 220px;
      width: 78px;
    }
  }
</style>
</head>

<body>

<div class="game">
  <h1>Sugar Jar Puzzle</h1>

  <p class="instructions">
    You have three sugar jars with capacities of <strong>12g</strong>, <strong>8g</strong>, and <strong>5g</strong>.<br>
    Initially, the 12g jar is full, and the other two jars are empty.<br>
    Pour sugar from one jar to another until any jar contains exactly <strong>6g</strong>.
  </p>

  <div class="jar-area" id="jarArea"></div>

  <div style="margin-top: 22px;">
    <button class="reset-btn" onclick="resetGame()">Reset</button>
  </div>

  <div class="message neutral" id="message">
    Select a source jar, then select a destination jar.
  </div>

  <div class="move-log" id="moveLog">
    <strong>Move Log</strong><br>
  </div>
</div>

<script>
  const jars = [
    { id: "A", capacity: 12, amount: 12 },
    { id: "B", capacity: 8, amount: 0 },
    { id: "C", capacity: 5, amount: 0 }
  ];

  let selectedJar = null;
  let moves = 0;

  const jarArea = document.getElementById("jarArea");
  const message = document.getElementById("message");
  const moveLog = document.getElementById("moveLog");

  function render() {
    jarArea.innerHTML = "";

    jars.forEach(jar => {
      const card = document.createElement("div");
      card.className = "jar-card";

      if (selectedJar === jar.id) {
        card.classList.add("selected");
      }

      const fillPercent = (jar.amount / jar.capacity) * 100;

      card.innerHTML = `
        <div class="jar">
          <div class="sugar" style="height:${fillPercent}%"></div>
          <div class="marks">
            ${createMarks(jar.capacity)}
          </div>
        </div>

        <div class="jar-info">Jar ${jar.id} — ${jar.capacity}g</div>
        <div class="jar-amount">Current: ${jar.amount}g</div>

        <button class="select-btn" onclick="selectJar('${jar.id}')">
          Select
        </button>
      `;

      jarArea.appendChild(card);
    });
  }

  function createMarks(capacity) {
    let html = "";

    for (let i = 1; i <= capacity; i++) {
      const position = 100 - (i / capacity) * 100;

      html += `
        <div class="mark" style="top:${position}%">
          ${i}
        </div>
      `;
    }

    return html;
  }

  function selectJar(id) {
    if (!selectedJar) {
      selectedJar = id;
      showMessage(`Jar ${id} selected as source. Now choose destination.`, "neutral");
      render();
      return;
    }

    if (selectedJar === id) {
      selectedJar = null;
      showMessage("Selection cleared.", "neutral");
      render();
      return;
    }

    pour(selectedJar, id);
    selectedJar = null;
    render();
    checkWin();
  }

  function pour(fromId, toId) {
    const from = jars.find(j => j.id === fromId);
    const to = jars.find(j => j.id === toId);

    if (from.amount === 0) {
      showMessage(`Jar ${fromId} is empty. Nothing to pour.`, "danger");
      return;
    }

    if (to.amount === to.capacity) {
      showMessage(`Jar ${toId} is already full.`, "danger");
      return;
    }

    const availableSpace = to.capacity - to.amount;
    const pouredAmount = Math.min(from.amount, availableSpace);

    from.amount -= pouredAmount;
    to.amount += pouredAmount;
    moves++;

    moveLog.innerHTML += `
      Move ${moves}: Poured ${pouredAmount}g from Jar ${fromId} to Jar ${toId}.<br>
    `;

    showMessage(
      `Poured ${pouredAmount}g from Jar ${fromId} to Jar ${toId}.`,
      "neutral"
    );
  }

  function checkWin() {
    const solvedJar = jars.find(jar => jar.amount === 6);

    if (solvedJar) {
      showMessage(
        `Correct. Jar ${solvedJar.id} contains exactly 6g. Secret digit unlocked: 4`,
        "success"
      );
    }
  }

  function resetGame() {
    jars[0].amount = 12;
    jars[1].amount = 0;
    jars[2].amount = 0;

    selectedJar = null;
    moves = 0;

    moveLog.innerHTML = "<strong>Move Log</strong><br>";

    showMessage("Game reset. Select a source jar, then destination jar.", "neutral");
    render();
  }

  function showMessage(text, type) {
    message.className = `message ${type}`;
    message.textContent = text;
  }

  render();
</script>

</body>
</html>
